<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CleanFrame Test</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #05070a;
               overflow: hidden; font-family: -apple-system, "Samsung Sans", sans-serif; color: #fff; }
  #art { position: absolute; inset: 0; background: url(art.jpg) center / cover no-repeat;
         transform: scale(1); animation: slowzoom 40s linear infinite alternate; }
  @keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.045); } }
  #vignette { position: absolute; inset: 0;
              background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.10) 45%, rgba(0,0,0,0.35) 100%); }

  .row { position: absolute; left: 64px; right: 64px; bottom: 210px; height: 300px;
         display: flex; gap: 40px; }
  .pane { position: relative; flex: 1; border-radius: 26px; overflow: hidden; }
  .pane .cap { position: absolute; left: 24px; top: 18px; font-size: 26px; font-weight: 600;
               letter-spacing: 0.02em; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .pane .verdict { position: absolute; left: 24px; bottom: 20px; font-size: 30px; font-weight: 700; }
  #realGlass { background: rgba(255,255,255,0.06);
               -webkit-backdrop-filter: blur(24px) saturate(1.1);
               backdrop-filter: blur(24px) saturate(1.1);
               border: 1px solid rgba(255,255,255,0.22); }
  #fakeGlass { background: url(art_small.jpg) center / cover no-repeat;
               border: 1px solid rgba(255,255,255,0.22); }
  #fakeGlass .tint { position: absolute; inset: 0; background: rgba(10,14,20,0.42); }

  #odometer { position: absolute; left: 64px; bottom: 120px; height: 64px; overflow: hidden;
              font-size: 44px; font-weight: 600; }
  #odometer .strip { transition: transform 240ms cubic-bezier(.22,.61,.36,1); }
  #odometer .strip div { height: 64px; line-height: 64px; }

  #panel { position: absolute; left: 64px; top: 48px; width: 900px; padding: 26px 30px;
           background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.14);
           border-radius: 20px; font-size: 24px; line-height: 1.45; }
  #panel h1 { margin: 0 0 12px 0; font-size: 30px; letter-spacing: 0.01em; }
  #panel .k { color: #9fb4c9; }
  #panel .ok { color: #7ee2a8; }
  #panel .bad { color: #ff9b8a; }
  #hint { position: absolute; right: 64px; bottom: 48px; font-size: 24px; color: rgba(255,255,255,0.8);
          text-align: right; line-height: 1.6; }
  #fps { position: absolute; right: 64px; top: 48px; font-size: 26px; font-weight: 600;
         background: rgba(0,0,0,0.5); padding: 10px 18px; border-radius: 12px; }
</style>
</head>
<body>
  <div id="art"></div>
  <div id="vignette"></div>

  <div class="row">
    <div class="pane" id="realGlass">
      <div class="cap">REAL backdrop-filter</div>
      <div class="verdict" id="realVerdict">checking…</div>
    </div>
    <div class="pane" id="fakeGlass">
      <div class="tint"></div>
      <div class="cap">TINY IMAGE (160×90) STRETCHED</div>
      <div class="verdict" id="fakeVerdict">always works</div>
    </div>
  </div>

  <div id="odometer"><div class="strip" id="strip">
    <div>YouTube</div><div>Netflix</div><div>Xbox</div><div>Viki</div><div>Prime Video</div>
  </div></div>

  <div id="panel">
    <h1>CleanFrame test app</h1>
    <div id="lines"></div>
  </div>

  <div id="fps">-- fps</div>

  <div id="hint">
    <b>ENTER</b> launch Prime Video<br>
    <b>1</b> send results · <b>2</b> hide panes<br>
    <b>BACK</b> exit
  </div>

<script>
(function () {
  var results = {};
  var lineEl = document.getElementById('lines');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function addLine(key, value, cls) {
    var d = document.createElement('div');
    d.innerHTML = '<span class="k">' + esc(key) + '</span> ' +
                  '<span class="' + (cls || '') + '">' + esc(value) + '</span>';
    lineEl.appendChild(d);
  }

  function hasBackdrop() {
    var el = document.createElement('div');
    var v = ['backdropFilter', 'webkitBackdropFilter'];
    for (var i = 0; i < v.length; i++) {
      if (v[i] in el.style) return true;
    }
    return false;
  }

  var cssSupports = false;
  try {
    cssSupports = window.CSS && CSS.supports && (CSS.supports('backdrop-filter', 'blur(4px)') ||
                  CSS.supports('-webkit-backdrop-filter', 'blur(4px)'));
  } catch (e) { cssSupports = false; }

  results.ua = navigator.userAgent;
  results.screen = screen.width + 'x' + screen.height;
  results.dpr = window.devicePixelRatio;
  results.cssSupportsBackdrop = !!cssSupports;
  results.stylePropBackdrop = hasBackdrop();
  results.hasTizen = typeof window.tizen !== 'undefined';
  results.hasFetch = typeof window.fetch === 'function';

  addLine('UA', results.ua);
  addLine('screen', results.screen + ' @' + results.dpr + 'x');
  addLine('CSS.supports backdrop-filter', String(results.cssSupportsBackdrop),
          results.cssSupportsBackdrop ? 'ok' : 'bad');
  addLine('style prop backdropFilter', String(results.stylePropBackdrop),
          results.stylePropBackdrop ? 'ok' : 'bad');
  addLine('window.tizen', String(results.hasTizen), results.hasTizen ? 'ok' : 'bad');
  addLine('fetch()', String(results.hasFetch));

  var realVerdict = document.getElementById('realVerdict');
  realVerdict.textContent = results.cssSupportsBackdrop ? 'supported (verify visually)' : 'NOT supported';

  if (window.tizen && tizen.systeminfo) {
    tizen.systeminfo.getPropertyValue('BUILD', function (b) {
      results.build = b;
      addLine('build', (b.model || '?') + ' · ' + (b.platformVersion || '?'), 'ok');
    }, function (e) { addLine('build', 'error: ' + e.message, 'bad'); });
  }

  function listApps() {
    if (!window.tizen || !tizen.application) return;
    try {
      tizen.application.getAppsInfo(function (apps) {
        results.appCount = apps.length;
        var names = [];
        for (var i = 0; i < apps.length && i < 6; i++) {
          names.push(apps[i].name + '=' + apps[i].id);
        }
        results.appSample = names.join(' | ');
        addLine('getAppsInfo', apps.length + ' apps', 'ok');
        addLine('sample', names.join(' · '));
      }, function (e) {
        results.appError = e.message;
        addLine('getAppsInfo', 'FAILED: ' + e.message, 'bad');
      });
    } catch (e2) {
      results.appError = String(e2);
      addLine('getAppsInfo', 'threw: ' + e2, 'bad');
    }
  }
  listApps();

  var launched = 'not tried';
  function launchPrime() {
    if (!window.tizen || !tizen.application) { launched = 'no tizen api'; return; }
    try {
      var ac = new tizen.ApplicationControl(
        'http://tizen.org/appcontrol/operation/main', null, null, null, null);
      tizen.application.launchAppControl(ac, 'org.tizen.primevideo',
        function () { launched = 'launched OK'; addLine('launchAppControl', launched, 'ok'); },
        function (e) { launched = 'error: ' + e.message; addLine('launchAppControl', launched, 'bad'); },
        { id: 'org.tizen.primevideo', name: 'Prime Video' });
    } catch (e3) {
      launched = 'threw: ' + e3;
      addLine('launchAppControl', launched, 'bad');
    }
  }

  var frames = 0, lastT = 0, worst = 0, longFrames = 0, windowStart = 0, windowFrames = 0;
  var fpsEl = document.getElementById('fps');
  function loop(t) {
    if (lastT) {
      var dt = t - lastT;
      if (dt > worst) worst = dt;
      if (dt > 34) longFrames++;
      windowFrames++;
      if (!windowStart) windowStart = t;
      if (t - windowStart >= 1000) {
        var fps = Math.round(windowFrames * 1000 / (t - windowStart));
        fpsEl.textContent = fps + ' fps';
        results.lastFps = fps;
        if (fps < (results.minFps || 999)) results.minFps = fps;
        windowStart = t; windowFrames = 0;
      }
    }
    lastT = t;
    frames++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var idx = 0;
  var strip = document.getElementById('strip');
  setInterval(function () {
    idx = (idx + 1) % 5;
    strip.style.transform = 'translateY(-' + (idx * 64) + 'px)';
  }, 1600);

  function post() {
    results.worstFrameMs = Math.round(worst);
    results.longFrames = longFrames;
    results.launched = launched;
    results.sentAt = new Date().toISOString();
    var body = JSON.stringify(results, null, 2);
    if (window.fetch) {
      fetch('http://YOUR_MAC_IP:8099/results', { method: 'POST', body: body })
        .then(function () { addLine('post', 'sent to Mac', 'ok'); })
        .catch(function (e) { addLine('post', 'failed: ' + e, 'bad'); });
    }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', 'http://YOUR_MAC_IP:8099/results', true);
      x.send(body);
    } catch (e4) { /* fetch already tried */ }
  }

  document.addEventListener('keydown', function (ev) {
    var k = ev.keyCode;
    if (k === 13) { launchPrime(); }
    else if (k === 49) { post(); }
    else if (k === 50) {
      var row = document.querySelector('.row');
      row.style.display = (row.style.display === 'none') ? 'flex' : 'none';
    }
    else if (k === 10009) {
      if (window.tizen && tizen.application) {
        tizen.application.getCurrentApplication().exit();
      }
    }
  });

  setTimeout(post, 15000);
})();
</script>
</body>
</html>
