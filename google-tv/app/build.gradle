plugins { id 'com.android.application' }
android {
    namespace 'dev.cleanframe.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.cleanframe.tv'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.1.0'
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '27.1.12297006'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
tasks.register('generateWeb', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'build_web.py'
    inputs.dir rootProject.file('../prototype')
    inputs.dir rootProject.file('web')
    inputs.file rootProject.file('build_web.py')
    inputs.file 'src/main/assets/profile.json'
    outputs.file 'src/main/assets/index.html'
}
tasks.register('buildPreviewCodec', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash','native/build-x264.sh'
    inputs.files rootProject.file('native/build-x264.sh'),rootProject.file('native/x264-version.txt')
    outputs.file rootProject.file('native/armeabi-v7a/lib/libx264.a')
}
tasks.configureEach { if (name.startsWith('configureCMake')) dependsOn 'buildPreviewCodec' }
tasks.named('preBuild').configure { dependsOn 'generateWeb','buildPreviewCodec' }
